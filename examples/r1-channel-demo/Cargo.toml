[package]
name = "r1-channel-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
kem1536 = { path = "../../crates/kem1536" }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["alloc", "aes", "zeroize"] }
