[package]
name = "kem-engine-pair"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace]
resolver = "2"

[features]
default = []
native = ["majax-mlkem/native"]

[dependencies]
kem1536 = { path = "../../crates/kem1536" }
majax-mlkem = { path = "../../.tools/comparison/mlkem1024-demo/engine", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = false

[lints.rust]
unsafe_code = "forbid"
