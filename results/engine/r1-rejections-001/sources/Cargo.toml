[workspace]
members = ["crates/kem1536", "crates/kem1536-cli", "crates/kem1024-reference"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.8.23"
ml-kem = { version = "=0.3.3", features = ["getrandom", "zeroize", "hazmat"] }
hex = "=0.4.3"
sha2 = "=0.10.9"
shake = "=0.1.0"
sha3 = { version = "=0.12.0", features = ["zeroize"] }
getrandom = "=0.4.3"
zeroize = "=1.9.1"
ctutils = "=0.4.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

